name: Update

# Every 6 hours: if Preygle/manga-downloader has a newer release, point the
# formula at its sdist (the hash comes from GitHub's own SHA-256 of the asset).
on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump to the latest release
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api repos/Preygle/manga-downloader/releases/latest)
          latest=$(jq -r '.tag_name | ltrimstr("v")' <<< "$release")
          current=$(grep -Po 'mangabinder-\K[0-9][^"]*(?=\.tar\.gz)' Formula/mangabinder.rb)
          echo "current $current, latest $latest"
          if [ "$latest" = "$current" ]; then exit 0; fi
          sha=$(jq -r --arg n "mangabinder-$latest.tar.gz" '.assets[] | select(.name == $n) | .digest | ltrimstr("sha256:")' <<< "$release")
          test -n "$sha"
          sed -i -E "s|download/v[^/]+/mangabinder-[^\"]+\.tar\.gz|download/v$latest/mangabinder-$latest.tar.gz|; s|sha256 \"[0-9a-f]+\"|sha256 \"$sha\"|" Formula/mangabinder.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mangabinder $latest"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"
      - name: Test the new version
        if: steps.bump.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref "${{ github.ref_name }}"
